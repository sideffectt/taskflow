# TaskFlow Docker Compose
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: taskflow-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=taskflow
    networks:
      - taskflow-network

  # TaskFlow API Service
  api:
    build: .
    container_name: taskflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DATABASE_NAME=taskflow
      - SECRET_KEY=f7d3b9a2e1c8f4d6a9b2c5e8f1d4a7b0c3e6f9d2a5b8c1e4f7a0d3b6c9e2f5a8
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - mongodb
    networks:
      - taskflow-network

volumes:
  mongodb_data:


networks:
  taskflow-network:
    driver: bridge
